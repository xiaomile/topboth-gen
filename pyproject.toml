[project]
name = "topboth-gen"
version = "2.1.0"
description = "MCP server for topboth image generation (Burgeon / Agnes)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
# 本项目是一个单文件 MCP 服务，不需要被打包/安装，仅同步依赖后直接运行脚本
package = false
